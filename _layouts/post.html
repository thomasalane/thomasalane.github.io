---
layout: default
---
<article class="wrap post">
  <a class="back-link reveal" href="{{ '/blog/' | relative_url }}"><span>&lt;</span> back to blog</a>

  <header class="post-head reveal">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %d, %Y" }}</time>
      <span class="sep">/</span>
      <span>{{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="prose reveal">
    {{ content }}
  </div>

  <footer class="post-foot reveal">
    <div class="rule"></div>
    <a class="back-link" href="{{ '/blog/' | relative_url }}"><span>&lt;</span> all posts</a>
  </footer>
</article>
