title: Thomas Alane
tagline: Data science, modeling & automation
email: thomassouzaalane@gmail.com
description: >-
  Data analysis, statistical modeling, and process automation — plus notes on
  blockchain, cryptography, security, and Bitcoin.
baseurl: ""
url: "https://thomasalane.github.io"

github_username: thomasalane
linkedin_url: "https://www.linkedin.com/in/thomassouzaalane"

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /blog/:year/:month/:day/:title/

twitter:
  card: summary_large_image

# Social preview image, applied to every page unless a page overrides `image`.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
