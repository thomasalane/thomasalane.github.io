<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-col">
      <div class="footer-brand"><span class="brand-prompt">~/</span>thomasalane</div>
      <p class="footer-tag">{{ site.tagline }}</p>
    </div>

    <nav class="footer-links" aria-label="Elsewhere">
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener">github</a>
      <a href="{{ site.linkedin_url }}" rel="me noopener">linkedin</a>
      <a href="mailto:{{ site.email }}">email</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </nav>
  </div>
  <div class="footer-meta wrap">
    <span>&copy; {{ 'now' | date: "%Y" }} Thomas Alane</span>
    <span class="footer-status"><i class="dot"></i> built with jekyll</span>
  </div>
</footer>
